<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="ui-overlay">
            <div class="score-display">
                <div class="score-label">Score</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="lives-display">
                <div class="lives-label">Lives</div>
                <div class="lives-value" id="lives">3</div>
            </div>
            <div class="wave-display">
                <div class="wave-label">Wave</div>
                <div class="wave-value" id="wave">1</div>
            </div>
        </div>
        
        <canvas id="gameCanvas"></canvas>
        
        <div class="menu-overlay" id="menuOverlay">
            <div class="menu-content">
                <h1 class="game-title">SPACE INVADERS</h1>
                <p class="game-subtitle">Defend Earth from the alien invasion!</p>
                <button class="start-button" id="startButton">Start Game</button>
                <div class="controls-info">
                    <p><strong>Controls:</strong></p>
                    <p>← → Arrow Keys or A D to move</p>
                    <p>Spacebar to shoot</p>
                </div>
            </div>
        </div>
        
        <div class="game-over-overlay" id="gameOverOverlay" style="display: none;">
            <div class="game-over-content">
                <h2 class="game-over-title">Game Over</h2>
                <p class="final-score">Final Score: <span id="finalScore">0</span></p>
                <p class="final-wave">Wave: <span id="finalWave">1</span></p>
                <button class="restart-button" id="restartButton">Play Again</button>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
